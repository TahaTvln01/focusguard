name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle --no-daemon :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk focusguard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: focusguard-apk
          path: focusguard.apk
      # Release tag = versionName in app/build.gradle; skipped if it already exists.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" focusguard.apk --target "$GITHUB_SHA" --title "$TAG" --generate-notes
