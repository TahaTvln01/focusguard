name: build
on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Signing key only exists as repo secrets; forks/PRs build with the debug key.
      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          [ -n "$KS_B64" ] || { echo "::warning::KEYSTORE_B64 secret yok: debug imza, Release oluşturulmaz"; exit 0; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
      - env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle --no-daemon :app:assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk focusguard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: focusguard-apk
          path: focusguard.apk
      # Release tag = versionName in app/build.gradle; only from main, only when signed, skipped if it exists.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$KEYSTORE_FILE" ] || exit 0
          TAG="v$(grep -oP "versionName '\K[^']+" app/build.gradle)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" focusguard.apk --target "$GITHUB_SHA" --title "$TAG" --generate-notes
