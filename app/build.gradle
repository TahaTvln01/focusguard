plugins { id 'com.android.application' }

// Release signing comes from CI secrets (KEYSTORE_FILE / KEYSTORE_PASS). Without them the debug key is used.
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.focusguard'
    compileSdk 35
    defaultConfig {
        applicationId 'app.focusguard'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '1.3.1'
    }
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'focusguard'
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint { checkReleaseBuilds false }
}
